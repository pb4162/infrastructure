---
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: audiobookshelf-media
spec:
  capacity:
    storage: ${ABS_MEDIA_VOLUME_SIZE}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    - dir_mode=0770
    - file_mode=0770
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: "//${NAS_URL}/audiobookshelf-media##"
    volumeAttributes:
      source: "//${NAS_URL}/audiobookshelf-media"
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: audiobookshelf-media
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: ${ABS_MEDIA_VOLUME_SIZE}
  volumeName: audiobookshelf-media
  storageClassName: smb
