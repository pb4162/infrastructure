apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: kube-system
spec:
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
      interval: 5m
  releaseName: headlamp
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: headlamp
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: headlamp
              spec:
                template:
                  spec:
                    hostAliases:
                      - hostnames:
                          - authentik.${ROOT_DOMAIN}
                        ip: ${TRAEFIK_IP}
  values:
    image:
      registry: pbcr.local
      repository: pb/headlamp
      tag: "v0.45.0-pb2"
    config:
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
      watchPlugins: true
      enableHelm: true
    persistentVolumeClaim:
      enabled: true
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    podSecurityContext:
      fsGroup: 101
      fsGroupChangePolicy: "OnRootMismatch"
    ingress:
      enabled: true
      hosts:
        - host: headlamp.${LOCAL_ROOT_DOMAIN}
          paths:
            - path: /
              type: Prefix
        - host: headlamp.${ROOT_DOMAIN}
          paths:
            - path: /
              type: Prefix
