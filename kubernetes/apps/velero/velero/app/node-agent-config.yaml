apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-config
  namespace: velero
data:
  policy.json: |
    {
      "loadConcurrency": {
        "globalConfig": 1,
        "prepareQueueLength": 10
      },
      "backupPVC": {
        "longhorn": {
          "storageClass": "longhorn-backup",
          "readOnly": true
        }
      }
    }
