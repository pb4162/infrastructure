apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meilisearch
  namespace: karakeep
spec:
  chart:
    spec:
      chart: meilisearch
      version: 0.40.0
      sourceRef:
        kind: HelmRepository
        name: meilisearch
      interval: 5m
  releaseName: meilisearch
  values:
    image:
      repository: getmeili/meilisearch
      tag: v1.54.0
    environment:
      MEILI_NO_ANALYTICS: true
      MEILI_ENV: production
      MEILI_UPGRADE_DB: true
    auth:
      existingMasterKeySecret: karakeep-secret
    persistence:
      enabled: true
      size: 5Gi
    command:
      - tini
      - --
      - /bin/sh
      - -c
      - /bin/meilisearch
      - --upgrade-db
