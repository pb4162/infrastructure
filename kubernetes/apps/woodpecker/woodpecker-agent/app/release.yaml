apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker-agent
  namespace: woodpecker
spec:
  chart:
    spec:
      chart: woodpecker
      version: 3.7.7
      sourceRef:
        kind: HelmRepository
        name: woodpecker
      interval: 5m
  releaseName: woodpecker-agent
  values:
    server:
      enabled: false
    agent:
      enabled: true
      replicaCount: 2
      env:
        WOODPECKER_SERVER: "ci-grpc.${ROOT_DOMAIN}:443"
        WOODPECKER_GRPC_SECURE: "true"
        WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-noretain
      createAgentSecret: false
      mapAgentSecret: false
      extraSecretNamesForEnvFrom:
        - woodpecker-agent-secret

