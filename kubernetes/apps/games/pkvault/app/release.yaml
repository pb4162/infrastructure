apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pkvault
  namespace: games
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  releaseName: pkvault
  values:
    controllers:
      main:
        enabled: true
        containers:
          main:
            image:
              repository: ghcr.io/chnapy/pkvault
              tag: 2.5.0
            env:
              BACKUP_FILE_COUNT_LIMIT: 30
            resources:
              limits:
                memory: 512Mi
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 3000
            targetPort: 3000
    ingress:
      main:
        enabled: true
        hosts:
          - host: pkvault.${LOCAL_ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: pkvault
                  port: 3000
          - host: pkvault.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: pkvault
                  port: 3000
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /pkvault
            readOnly: false
