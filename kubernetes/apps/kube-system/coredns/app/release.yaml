apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: kube-system
spec:
  chart:
    spec:
      chart: coredns
      version: 1.48.2
      sourceRef:
        kind: HelmRepository
        name: coredns
      interval: 5m
  releaseName: coredns
  values:
    replicaCount: 3
    k8sAppLabelOverride: kube-dns
    priorityClassName: system-cluster-critical
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.43.0.10
    prometheus:
      monitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
