apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kavita
  namespace: kavita
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  releaseName: kavita
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/kareadita/kavita
              tag: 0.9.1
            env:
              TZ:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: TIMEZONE
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 5000
    ingress:
      main:
        enabled: true
        hosts:
          - host: kavita.${LOCAL_ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: kavita
                  port: 5000
          - host: kavita.${ROOT_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: kavita
                  port: 5000
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts:
          - path: /kavita/config
            readOnly: false
      abs-media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: audiobookshelf
        globalMounts:
          - path: /books
            readOnly: false
