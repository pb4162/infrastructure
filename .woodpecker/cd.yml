when:
  - event: push
    branch: main
  - event: manual


steps:
  - name: Pull repo with ansible_cd python script
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      remote: "https://github.com/pb4162/infrastructure.git"
      path: "script_home"

  - name: Run ansible_cd python script
    image: python:3.14.7
    environment:
      SEMAPHOREUI_KEY:
        from_secret: semaphoreui_key
      SEMAPHOREUI_HOST:
        from_secret: semaphoreui_host
      SEMAPHOREUI_PROJECT_ID:
        from_secret: semaphoreui_project_id
      SEMAPHOREUI_TASK_TEMPLATE_ID:
        from_secret: semaphoreui_task_template_id
    commands:
      - pip install requests
      - git config --global --add safe.directory '.'
      - python script_home/scripts/ansible_cd.py
