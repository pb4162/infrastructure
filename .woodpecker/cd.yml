when:
  - event: push
    branch: main
  - event: manual


clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      branch: ${FORWARDED_CI_COMMIT_BRANCH:-CI_COMMIT_BRANCH}
      remote: ${FORWARDED_CI_REPO_CLONE_URL:-CI_REPO_CLONE_URL}
      sha: ${FORWARDED_CI_COMMIT_SHA:-CI_COMMIT_SHA}
      path: ${FORWARDED_CI_WORKSPACE:-CI_WORKSPACE}
      target-branch: ${FORWARDED_CI_COMMIT_TARGET_BRANCH:-CI_COMMIT_TARGET_BRANCH}


steps:
  - name: Run ansible_cd python script
    image: python:3.14.7
    environment:
      SEMAPHOREUI_KEY:
        from_secret: semaphoreui_key
      SEMAPHOREUI_HOST:
        from_secret: semaphoreui_host
      SEMAPHOREUI_PROJECT_ID:
        from_secret: semaphoreui_project_id
      SEMAPHOREUI_TASK_TEMPLATE_ID:
        from_secret: semaphoreui_task_template_id
    commands:
      - pip install requests
      - git config --global --add safe.directory '.'
      - python scripts/ansible_cd.py
