when:
  - event: push
    branch: main
    path: 'ansible/**'
  - event: manual

labels:
  type: control-plane

depends_on:
  - ansible-lint
  - name: ci-tools
    optional: true

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false

steps:
  - name: ansible-cd
    image: registry.pb4162.dev/pb/ci-tools:latest
    environment:
      SEMAPHOREUI_KEY:
        from_secret: semaphoreui_key
      SEMAPHOREUI_HOST:
        from_secret: semaphoreui_host
      SEMAPHOREUI_PROJECT_ID:
        from_secret: semaphoreui_project_id
      SEMAPHOREUI_TASK_TEMPLATE_ID:
        from_secret: semaphoreui_task_template_id
      SEMAPHOREUI_PRIVATE_TASK_TEMPLATE_ID:
        from_secret: semaphoreui_private_task_template_id
    commands:
      - git config --global --add safe.directory '$CI_WORKSPACE'
      - python ansible_cd.py
