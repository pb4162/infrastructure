sanoid_conf: |
  [tank/data]
  use_template = base

  recursive = yes
  autoprune = yes
  autosnap = yes

  {% if syncoid_source is defined and inventory_hostname != syncoid_source %}
  [tank/backup]
  use_template = base

  recursive = yes
  autoprune = yes
  autosnap = no

  {% endif %}
  [template_base]
  daily = 14
  weekly = 4
  monthly = 12

  daily_hour = 0
  daily_min = 0

  weekly_wday = 0
  weekly_hour = 0
  weekly_min = 0

  monthly_mday = 1
  monthly_hour = 0
  monthly_min = 0
