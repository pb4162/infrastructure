---
pb4162_cert_fullchain_path: "pb4162.dev_ecc/fullchain.cer"
pb4162_cert_key_path: "pb4162.dev_ecc/pb4162.dev.key"

nginx_additional_modules:
  - mail
  - stream

nginx_http_configs:
  default: |
    server {
        listen 80 default_server;
        listen 443 ssl default_server;

        if ($scheme = "http") {
            return 301 https://$host$request_uri;
        }
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        server_name _;

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

        return 444;
    }
  # https://github.com/nextcloud/all-in-one/blob/main/reverse-proxy.md
  nextcloud: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # listen 443 ssl http2;      # for nginx versions below v1.25.1
        # listen [::]:443 ssl http2; # for nginx versions below v1.25.1 - comment to disable IPv6

        listen 443 ssl;      # for nginx v1.25.1+
        listen [::]:443 ssl; # for nginx v1.25.1+ - keep comment to disable IPv6
        http2 on;            # uncomment to enable HTTP/2 - supported on nginx v1.25.1+

        # listen 443 quic reuseport;       # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+ - please remove "reuseport" if there is already another quic listener on port 443 with enabled reuseport
        # listen [::]:443 quic reuseport;  # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+ - please remove "reuseport" if there is already another quic listener on port 443 with enabled reuseport - keep comment to disable IPv6
        # http3 on;                                 # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+
        # quic_gso on;                              # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+
        # quic_retry on;                            # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+
        # quic_bpf on;                              # improves  HTTP/3 / QUIC - supported on nginx v1.25.0+, if nginx runs as a docker container you need to give it privileged permission to use this option
        add_header Alt-Svc 'h3=":443"; ma=86400'; # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 0;
        client_body_buffer_size 512k;
        http3_stream_buffer_size 512k; # uncomment to enable HTTP/3 / QUIC - supported on nginx v1.25.0+
        proxy_read_timeout 3610s;

        server_name nextcloud.{{ root_domain }};

        location / {
            proxy_pass https://{{ traefik_tailscale_ip }}$request_uri; # Adjust to match APACHE_PORT and APACHE_IP_BINDING. See https://github.com/nextcloud/all-in-one/blob/main/reverse-proxy.md#adapting-the-sample-web-server-configurations-below

            include /etc/nginx/proxy_params;

            proxy_set_header Early-Data $ssl_early_data;

            # Websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # If running nginx on a subdomain (eg. nextcloud.example.com) of a domain that already has an wildcard ssl certificate from certbot on this machine,
        # the <your-nc-domain> in the below lines should be replaced with just the domain (eg. example.com), not the subdomain.
        # In this case the subdomain should already be secured without additional actions
        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

        # TODO:
        # ssl_dhparam /etc/dhparam; # curl -L https://ssl-config.mozilla.org/ffdhe2048.txt -o /etc/dhparam

        ssl_early_data on;
        ssl_session_timeout 1d;
        # ssl_session_cache shared:SSL:10m;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve x25519:x448:secp521r1:secp384r1:secp256r1;

        ssl_prefer_server_ciphers on;
        ssl_conf_command Options PrioritizeChaCha;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    }

    # talk high performance backend
    server {
        listen 443 ssl;      # for nginx v1.25.1+
        listen [::]:443 ssl; # for nginx v1.25.1+ - keep comment to disable IPv6
        http2 on;            # uncomment to enable HTTP/2 - supported on nginx v1.25.1+

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 0;
        client_body_buffer_size 512k;
        proxy_read_timeout 3610s;

        server_name talk-hpb.nextcloud.{{ root_domain }};

        location / {
            proxy_pass https://{{ traefik_tailscale_ip }}$request_uri;

            include /etc/nginx/proxy_params;

            proxy_set_header Early-Data $ssl_early_data;

            # Websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};
    }

    # collabora
    server {
        listen 443 ssl;      # for nginx v1.25.1+
        listen [::]:443 ssl; # for nginx v1.25.1+ - keep comment to disable IPv6
        http2 on;            # uncomment to enable HTTP/2 - supported on nginx v1.25.1+

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 0;
        client_body_buffer_size 512k;
        proxy_read_timeout 3610s;

        server_name collabora.nextcloud.{{ root_domain }};

        location / {
            proxy_pass https://{{ traefik_tailscale_ip }}$request_uri;

            include /etc/nginx/proxy_params;

            proxy_set_header Early-Data $ssl_early_data;

            # Websocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};
    }
  # https://docs.mailcow.email/post_installation/reverse-proxy/r_p-nginx/
  mailcow: |
    server {
      listen 80; # default_server;
      listen [::]:80; # default_server;
      server_name {{ mailcow_domain }} autodiscover.* autoconfig.*;
      return 301 https://$host$request_uri;
    }
    server {
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name mail.{{ root_domain }} autodiscover.* autoconfig.*;

      ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
      ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};
      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:50m;
      ssl_session_tickets off;

      # See https://ssl-config.mozilla.org/#server=nginx for the latest ssl settings recommendations
      # An example config is given below
      ssl_protocols TLSv1.2;
      ssl_ciphers HIGH:!aNULL:!MD5:!SHA1:!kRSA;
      ssl_prefer_server_ciphers off;

      location /Microsoft-Server-ActiveSync {
        proxy_pass http://127.0.0.1:{{ mailcow_http_port }}/Microsoft-Server-ActiveSync;

        include /etc/nginx/proxy_params;

        proxy_connect_timeout 75;
        proxy_send_timeout 3650;
        proxy_read_timeout 3650;
        proxy_buffers 64 512k; # Needed since the 2022-04 Update for SOGo
        client_body_buffer_size 512k;
        client_max_body_size 0;
      }

      location / {
        proxy_pass http://127.0.0.1:{{ mailcow_http_port }}/;

        include /etc/nginx/proxy_params;

        client_max_body_size 0;
      # The following Proxy Buffers has to be set if you want to use SOGo after the 2022-04 (April 2022) Update
      # Otherwise a Login will fail like this: https://github.com/mailcow/mailcow-dockerized/issues/4537
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;
      }
    }
  flux-webhook: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name flux-webhook.{{ root_domain }};

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

        location / {
            proxy_pass https://{{ traefik_tailscale_ip }}$request_uri;

            include /etc/nginx/proxy_params;

            proxy_set_header Early-Data $ssl_early_data;
        }
    }
  gatus: |
    server {
        listen 443 ssl;

        server_name status.{{ root_domain }};

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

        client_max_body_size 0;

        location / {
            proxy_pass http://localhost:{{ gatus_port }};

            include /etc/nginx/proxy_params;
        }

    }
  gitea: |
    server {
        listen 443 ssl;

        server_name gitea.{{ root_domain }};

        ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
        ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

        location / {
            client_max_body_size 512M;
            proxy_pass https://{{ traefik_tailscale_ip }};
            proxy_set_header Connection $http_connection;
            proxy_set_header Upgrade $http_upgrade;

            include /etc/nginx/proxy_params;
        }
    }
  ci: |
    server {
      listen 443 ssl;
      server_name ci.{{ root_domain }};

      ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
      ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};

      location / {
        proxy_pass https://{{ woodpeckerci_server_ip }};

        include /etc/nginx/proxy_params;
      }
    }

nginx_stream_configs:
  nextcloud: |
    upstream nc-turn {
      server {{ nextcloud_turn_server_ip }}:3478;
    }

    server {
      listen 3478;
      listen 3478 udp;
      server_name turn.nextcloud.{{ root_domain }};
      proxy_pass nc-turn;
      proxy_buffer_size 20m;
    }
