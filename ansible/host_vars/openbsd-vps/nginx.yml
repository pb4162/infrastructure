pb4162_cert_fullchain_path: "pb4162.dev_ecc/fullchain.cer"
pb4162_cert_key_path: "pb4162.dev_ecc/pb4162.dev.key"

nginx_http_configs:
  headscale: |
    map $http_upgrade $connection_upgrade {
      default      upgrade;
      ''           close;
    }

    server {
      listen 80;
      listen [::]:80;

      listen 443      ssl http2;
      listen [::]:443 ssl http2;

      server_name vpn.{{ root_domain }};

      ssl_certificate {{ (acme_home, pb4162_cert_fullchain_path) | path_join }};
      ssl_certificate_key {{ (acme_home, pb4162_cert_key_path) | path_join }};
      ssl_protocols TLSv1.2 TLSv1.3;

      location ~ /(apple|windows) {
        deny all;
        return 404;
      }

      location /web {
        alias /var/www/html/headscale-admin;
        index index.html;
      }

      location / {
          proxy_pass http://127.0.0.1:8081;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $server_name;
          proxy_redirect http:// https://;
          proxy_buffering off;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
      }
    }
