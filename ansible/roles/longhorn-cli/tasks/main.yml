- name: Create downloads directory
  ansible.builtin.file:
    path: "~/longhorn-cli"
    state: directory

- name: Download longhornctl binary
  ansible.builtin.get_url:
    dest: "~/longhorn-cli/longhornctl-{{ longhorn_cli_version }}"
    url: "https://github.com/longhorn/cli/releases/download/{{ longhorn_cli_version }}/longhornctl-linux-{{ release_arch }}"
    checksum: "sha256:https://github.com/longhorn/cli/releases/download/{{ longhorn_cli_version }}/longhornctl-linux-{{ release_arch }}.sha256"
    force: true

- name: Copy longhornctl binary to /usr/local/bin
  ansible.builtin.copy:
    src: "~/longhorn-cli/longhornctl-{{ longhorn_cli_version }}"
    dest: /usr/local/bin/longhornctl
    mode: a+x
    remote_src: yes
