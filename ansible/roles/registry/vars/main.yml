container_data_dir: "{{ registry_base_dir }}"
app_name: registry
app_directories:
  - data
app_networks:
  - registry
app_containers:
  - image: "registry:{{ registry_version }}"
    name: registry-server
    env:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
    volumes:
      - "{{ (app_base_dir, 'data') | path_join }}:/var/lib/registry"
    networks:
      - { name: registry }

  - image: "joxit/docker-registry-ui:{{ registry_ui_version }}"
    name: registry-ui
    env:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: Docker Registry UI
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_PROXY_PASS_URL: http://registry-server:5000
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_MIN_BRANCHES: "1"
      CATALOG_MAX_BRANCHES: "1"
      TAGLIST_PAGE_SIZE: "100"
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: "1000"
    networks:
      - { name: registry }
      - { name: bridge }
    labels:
      traefik.enable: "true"
      traefik.docker.network: bridge
      traefik.http.routers.registry-ui.rule: "Host(`registry.{{ root_domain }}`)"
      traefik.http.services.registry-ui.loadbalancer.server.port: 80
      traefik.http.routers.registry-ui.middlewares: registry-basic-auth
      traefik.http.middlewares.registry-basic-auth.basicauth.users: "{{ registry_users | join(',') }}"
