# TODO: there *has* to be a better approach than this monstrosity
workflow_files_raw: >-
  {% set ns = namespace(data=[]) %}
  {% set files = query('ansible.builtin.fileglob', (playbook_dir, '../../.woodpecker/*.yml') | path_join) %}
  {% for f in files %}
  {% set ns.data = ns.data + [
    {
      "path": ("config-extension/workflows", (f | basename)) | path_join,
      "content": lookup('ansible.builtin.file', f)
    }
  ] %}
  {% endfor %}
  {{ ns.data }}
config_extension_templates:
  - path: config-extension/config/config.yml
    content:
      validate_requests: false
      woodpecker_url: "https://ci.{{ root_domain }}"

app_templates: "{{ workflow_files_raw | from_yaml + config_extension_templates }}"
app_name: woodpeckerci
app_directories:
  - path: server
    owner: 1000
    group: 1000
  - path: agent
    owner: 1000
    group: 1000
  - config-extension/config
  - config-extension/workflows
app_networks:
  - woodpecker
app_containers:
  - image: "woodpeckerci/woodpecker-server:{{ woodpecker_version }}"
    name: woodpecker-server
    env: "{{
      woodpecker_env_base | ansible.builtin.combine(
        woodpecker_env_server_base,
        woodpecker_env_server,
        woodpecker_env_server_private,
        recursive=true
      )
      }}"
    volumes:
      - "{{ (app_base_dir, 'server') | path_join }}:/var/lib/woodpecker"
    networks:
      - { name: bridge }
      - { name: woodpecker }
    labels:
      traefik.enable: "true"
      traefik.docker.network: bridge
      traefik.http.routers.woodpecker.rule: "Host(`ci.{{ root_domain }}`)"
      traefik.http.services.woodpecker.loadbalancer.server.port: 8000
      traefik.http.routers.woodpecker.service: woodpecker
      traefik.http.routers.woodpecker-grpc.rule: "Host(`ci-grpc.{{ root_domain }}`)"
      traefik.http.services.woodpecker-grpc.loadbalancer.server.port: 9000
      traefik.http.routers.woodpecker-grpc.service: woodpecker-grpc
      traefik.http.services.woodpecker-grpc.loadbalancer.server.scheme: h2c

  - image: "woodpeckerci/woodpecker-agent:{{ woodpecker_version }}"
    name: woodpecker-agent
    command: agent
    env: "{{
      woodpecker_env_base | ansible.builtin.combine(
        woodpecker_env_agent_base,
        recursive=true
      )
      }}"
    volumes:
      - "{{ (app_base_dir, 'agent') | path_join }}:/etc/woodpecker"
      # TODO: docker socket proxy?
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - { name: woodpecker }

  - image: "pb4162/woodpecker-config-extension:{{ woodpecker_config_extension_version }}"
    name: woodpecker-config-extension
    volumes:
      - "{{ (app_base_dir, 'config-extension', 'config') | path_join }}:/config"
      - "{{ (app_base_dir, 'config-extension', 'workflows') | path_join }}:/workflows"
    networks:
      - { name: woodpecker }

woodpecker_env_base:
  WOODPECKER_AGENT_SECRET: "{{ woodpecker_agent_secret }}"
woodpecker_env_server_base:
  WOODPECKER_HOST: "https://ci.{{ root_domain }}"
woodpecker_env_agent_base:
  WOODPECKER_SERVER: woodpecker-server:9000
  WOODPECKER_KEEPALIVE_TIME: 30s
  WOODPECKER_RETRY_TIMEOUT: 10m
  WOODPECKER_AGENT_LABELS: type=control-plane
