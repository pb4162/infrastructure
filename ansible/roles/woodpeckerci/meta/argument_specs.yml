---
argument_specs:
  main:
    options:
      docker_data_dir:
        type: str
        required: false
        default: "~/docker"
      woodpecker_version:
        type: str
        required: true
      woodpecker_config_extension_version:
        type: str
        required: true
      root_domain:
        type: str
        required: true
      woodpecker_env_server:
        type: dict
        required: false
        default: {}
      woodpecker_env_server_private:
        type: dict
        required: false
        default: {}
