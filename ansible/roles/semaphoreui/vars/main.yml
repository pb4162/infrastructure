app_name: semaphoreui
app_directories:
  - path: data
    owner: 1001
    group: 1001
  - path: config
    owner: 1001
    group: 1001
  - path: tmp
    owner: 1001
    group: 1001
app_containers:
  - image: "{{ pbcr_registry_url }}/pb/semaphoreui:{{ semaphoreui_version }}"
    name: semaphoreui
    env: "{{ semaphoreui_env | ansible.builtin.combine(semaphoreui_env_private, recursive=true) }}"
    volumes:
      - "{{ (app_base_dir, 'data') | path_join }}:/var/lib/semaphore"
      - "{{ (app_base_dir, 'config') | path_join }}:/etc/semaphore"
      - "{{ (app_base_dir, 'tmp') | path_join }}:/tmp/semaphore"
    networks:
      - { name: bridge }
    labels:
      traefik.enable: "true"
      traefik.http.routers.semaphoreui.rule: "Host(`semaphore.{{ root_domain }}`)"
      traefik.http.services.semaphoreui.loadbalancer.server.port: 3000
